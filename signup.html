<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up | Wanderly</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<header class="navbar"><a class="logo" href="index.html">Wander<span>ly</span></a><nav><a href="index.html">Home</a><a href="destinations.html">Explore</a><button id="themeToggle" class="theme-btn">🌙</button></nav></header>
<main class="auth-wrap"><div class="auth-card"><div class="auth-side"><p class="eyebrow">JOIN WANDERLY</p><h1>Make a list of places worth remembering.</h1><p>Create a simple demo account and start saving your favourite destinations.</p></div><form id="signupForm" class="auth-form" novalidate><h2>Create Account</h2><label>Full Name<input id="signupName" type="text" placeholder="Your name"></label><small class="error" id="signupNameError"></small><label>Email<input id="signupEmail" type="email" placeholder="you@example.com"></label><small class="error" id="signupEmailError"></small><label>Password<input id="signupPassword" type="password" placeholder="Minimum 6 characters"></label><small class="error" id="signupPasswordError"></small><label>Confirm Password<input id="signupConfirm" type="password" placeholder="Re-enter password"></label><small class="error" id="signupConfirmError"></small><button class="btn primary full" type="submit">Create Account</button><p id="signupMessage" class="form-message"></p><p class="switch">Already have an account? <a href="login.html">Login</a></p></form></div></main>
<script src="js/script.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/validation.js"></script>
<script src="js/auth.js"></script>
</body></html>
